<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070807" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="RUMBO · Hábitos, evolución física y entrenamiento. Cada pequeño paso cuenta." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUMBO" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RUMBO</title>
    <script>
      // Apply the stored theme and accent before first paint to avoid any flash.
      (function () {
        try {
          var t = localStorage.getItem('rumbo.theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          // Lime identity: older installs switch to it once (see ThemeProvider).
          if (localStorage.getItem('rumbo.identity') !== '2') {
            localStorage.setItem('rumbo.identity', '2');
            localStorage.setItem('rumbo.accent', 'volt');
          }
          var a = localStorage.getItem('rumbo.accent');
          document.documentElement.dataset.accent = /^(rojo|naranja|volt|cian|violeta|fucsia)$/.test(a) ? a : 'volt';
          var bg = t === 'dark' ? '#070807' : '#f1f2ec';
          document.documentElement.style.background = bg;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>RUMBO necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
